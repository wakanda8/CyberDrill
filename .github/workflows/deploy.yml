# Runs the tests on every pull request and push to main. After a push to main passes,
# deploys to the production server through AWS Systems Manager. See DEPLOY.md.
name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: composer test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets GitHub sign in to AWS with OIDC, so no AWS keys are stored here
    concurrency: production-deploy
    env:
      INSTANCE_ID: ${{ secrets.CYBERDRILL_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-5

      - name: Deploy to the production server
        run: |
          # Deploy exactly the commit this run tested, not whatever main is by the time the server pulls.
          cmd=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name CyberDrill-Deploy \
            --parameters "commit=$GITHUB_SHA" \
            --comment "GitHub Actions ${GITHUB_SHA::7}" --query Command.CommandId --output text)
          # Wait a little longer than the document's 30-minute timeout.
          for _ in $(seq 1 190); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "Deploy status: $status"
          test "$status" = Success
